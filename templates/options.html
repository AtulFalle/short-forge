<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Forge - Options</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;600;800&family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
{{themeCss}}
{{backgroundCss}}
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
            color: var(--text-primary);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            padding: 100px 80px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: -24px;
            background-image: var(--background-image), linear-gradient(135deg, var(--bg-grad-start), var(--bg-grad-end));
            background-size: cover;
            background-position: center;
            filter: blur(var(--background-blur)) saturate(var(--background-saturation)) contrast(var(--background-contrast));
            transform: scale(1.03);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 18% 82%, color-mix(in srgb, var(--accent-secondary) 24%, transparent), transparent 42%),
                linear-gradient(180deg, rgba(0, 0, 0, var(--background-overlay-opacity)), rgba(0, 0, 0, calc(var(--background-overlay-opacity) + 0.08)));
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            align-items: center;
        }

        .hook-badge {
            display: inline-block;
            background: linear-gradient(90deg, color-mix(in srgb, var(--accent-secondary) 22%, transparent), color-mix(in srgb, var(--accent-primary) 22%, transparent));
            color: var(--accent-primary);
            padding: 16px 32px;
            border-radius: 100px;
            font-size: 36px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 80px;
            border: 1px solid color-mix(in srgb, var(--accent-primary) 45%, transparent);
        }

        .header-text {
            font-size: 84px;
            font-weight: 800;
            margin-bottom: 120px;
            text-align: center;
            letter-spacing: -2px;
            background: linear-gradient(to bottom, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .options-list {
            list-style: none;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .option-item {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 60px 80px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 40px;
            transition: all 0.3s ease;
        }

        .option-marker {
            width: 32px;
            height: 32px;
            background: var(--accent-secondary);
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 20px color-mix(in srgb, var(--accent-secondary) 60%, transparent);
        }

        .option-text {
            font-size: 54px;
            font-weight: 600;
            color: var(--text-primary);
            word-break: break-word;
        }

        .timer-container {
            margin-top: auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px 80px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            gap: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .timer-icon {
            font-size: 56px;
        }

        .timer-text {
            font-size: 64px;
            font-weight: 800;
            font-family: var(--font-mono);
            color: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="hook-badge">{{hook}}</div>
        
        <h1 class="header-text">What's the Output?</h1>
        
        <ul class="options-list">
            {{options}}
        </ul>

        <div class="timer-container">
            <span class="timer-icon">⏳</span>
            <span class="timer-text">{{timer}}s</span>
        </div>
    </div>
</body>
</html>
