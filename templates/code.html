<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Forge - Question</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;600;800&family=Outfit:wght@400;600;800&family=Space+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
{{themeCss}}
{{backgroundCss}}
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
            color: var(--text-primary);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            padding: 100px 80px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: -24px;
            background-image: var(--background-image), linear-gradient(135deg, var(--bg-grad-start), var(--bg-grad-end));
            background-size: cover;
            background-position: center;
            filter: blur(var(--background-blur)) saturate(var(--background-saturation)) contrast(var(--background-contrast));
            transform: scale(1.03);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 80% 12%, color-mix(in srgb, var(--accent-primary) 24%, transparent), transparent 42%),
                linear-gradient(180deg, rgba(0, 0, 0, var(--background-overlay-opacity)), rgba(0, 0, 0, calc(var(--background-overlay-opacity) + 0.08)));
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .hook-badge {
            display: inline-block;
            background: linear-gradient(90deg, color-mix(in srgb, var(--accent-secondary) 22%, transparent), color-mix(in srgb, var(--accent-primary) 22%, transparent));
            color: var(--accent-primary);
            padding: 16px 32px;
            border-radius: 100px;
            font-size: 36px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 40px;
            border: 1px solid color-mix(in srgb, var(--accent-primary) 45%, transparent);
            align-self: flex-start;
        }

        .question-text {
            font-size: 64px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 60px;
            text-wrap: balance;
            word-break: break-word;
        }

        .code-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 50px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Mac OS style window controls */
        .window-controls {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .window-controls div {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .wc-red { background-color: #ff5f56; }
        .wc-yellow { background-color: #ffbd2e; }
        .wc-green { background-color: #27c93f; }

        .code-block {
            font-family: var(--font-mono);
            font-size: 40px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-primary);
            overflow: hidden;
        }

        .footer-logo {
            margin-top: auto;
            text-align: center;
            font-size: 40px;
            font-weight: 800;
            color: var(--text-secondary);
            opacity: 0.4;
            letter-spacing: 6px;
            padding-top: 60px;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="hook-badge">{{hook}}</div>
        
        <div class="question-text">{{question}}</div>
        
        <div class="code-container">
            <div class="window-controls">
                <div class="wc-red"></div>
                <div class="wc-yellow"></div>
                <div class="wc-green"></div>
            </div>
            <pre class="code-block"><code>{{code}}</code></pre>
        </div>

        <div class="footer-logo">SHORT FORGE</div>
    </div>
</body>
</html>
