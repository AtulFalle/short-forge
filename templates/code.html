<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Forge Puzzle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --code-bg: #020617;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            padding: 80px;
            overflow: hidden; /* Requirement: overflow: hidden */
        }

        .hook {
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 40px;
            color: var(--accent-color);
            line-height: 1.2;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            word-break: break-word; /* Requirement: word-break: break-word */
        }

        .code-container {
            background-color: var(--code-bg);
            border-radius: 24px;
            padding: 60px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            flex: 1; /* Requirement: Content (flex:1) */
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent container overflow */
        }

        .code-block {
            font-family: var(--font-mono);
            font-size: 38px;
            line-height: 1.5;
            white-space: pre-wrap; /* Requirement: white-space: pre-wrap */
            word-break: break-word; /* Requirement: word-break: break-word */
            color: #e2e8f0;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .options-list {
            list-style: none;
            margin-top: auto; /* Push to bottom of container if code is short */
        }

        .options-list li {
            background-color: var(--card-bg);
            padding: 30px 40px;
            margin-bottom: 20px;
            border-radius: 16px;
            font-size: 42px;
            font-weight: 400;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            word-break: break-word;
        }

        .options-list li:last-child {
            margin-bottom: 0;
        }

        .options-list li::before {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            background-color: var(--accent-color);
            border-radius: 50%;
            margin-right: 30px;
            flex-shrink: 0;
        }

        .footer {
            text-align: center;
            font-size: 56px;
            font-weight: 700;
            padding: 50px;
            background: linear-gradient(to right, #0ea5e9, #2563eb);
            border-radius: 24px;
            color: white;
            box-shadow: 0 10px 30px rgba(14, 165, 233, 0.3);
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="hook">{{hook}}</div>
    
    <div class="code-container">
        <pre class="code-block"><code>{{code}}</code></pre>
        
        <ul class="options-list">
            {{options}}
        </ul>
    </div>

    <div class="footer">
        {{footer}}
    </div>
</body>
</html>
