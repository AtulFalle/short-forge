<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Forge - Answer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-grad-start: #060913;
            --bg-grad-end: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --glass-bg: rgba(30, 41, 59, 0.6);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-sans: 'Outfit', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1920px;
            background: linear-gradient(135deg, var(--bg-grad-start) 0%, var(--bg-grad-end) 100%);
            color: var(--text-primary);
            font-family: var(--font-sans);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 100px 80px;
            overflow: hidden;
            position: relative;
        }

        /* Background glow */
        body::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1000px;
            height: 1000px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(60px);
            z-index: 0;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .success-icon {
            font-size: 160px;
            margin-bottom: 40px;
            text-shadow: 0 0 50px rgba(16, 185, 129, 0.4);
        }

        .answer-title {
            font-size: 80px;
            font-weight: 800;
            margin-bottom: 60px;
            text-align: center;
            background: linear-gradient(to bottom, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -3px;
        }

        .answer-card {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 48px;
            padding: 80px 60px;
            width: 100%;
            border: 2px solid var(--accent-green);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-bottom: 60px;
        }

        .answer-text {
            font-family: var(--font-mono);
            font-size: 84px;
            font-weight: 600;
            color: #fff;
            word-break: break-word;
        }

        .explanation-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 32px;
            padding: 60px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .explanation-label {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-green);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 24px;
            display: block;
        }

        .explanation-text {
            font-size: 48px;
            line-height: 1.4;
            color: var(--text-secondary);
            text-wrap: balance;
        }

        .footer-logo {
            margin-top: 80px;
            font-size: 40px;
            font-weight: 800;
            color: var(--text-secondary);
            opacity: 0.2;
            letter-spacing: 10px;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <div class="success-icon">✅</div>
        
        <h1 class="answer-title">Correct Answer</h1>
        
        <div class="answer-card">
            <div class="answer-text">{{answer}}</div>
        </div>

        <div class="explanation-container">
            <span class="explanation-label">Why?</span>
            <p class="explanation-text">{{explanation}}</p>
        </div>

        <div class="footer-logo">SHORT FORGE</div>
    </div>
</body>
</html>
